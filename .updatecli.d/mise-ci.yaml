# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update Mise In CI
pipelineid: update-mise-in-ci
labels:
  group: mise
sources:
  version:
    kind: githubrelease
    spec:
      owner: jdx
      repository: mise
      token: '{{ env "GITHUB_TOKEN" }}'
      versionfilter:
        kind: semver
        pattern: "*"
    transformers:
      - trimprefix: v
targets:
  action:
    kind: yaml
    sourceid: version
    spec:
      engine: yamlpath
      file: .github/actions/mise/action.yaml
      key: $.runs.steps[?(@.uses =~ /^jdx\/mise-action@/)].with.version
