[bifrost]
inferencePath = "/v1"
origin = "https://bifrost.excloo.com"

[mcp]
actual_budget = "/mcp/actual-budget"
home_assistant = "/mcp/home-assistant"
immich = "/mcp/immich"
karakeep = "/mcp/karakeep"
kubernetes = "/mcp/kubernetes"
larapaper = "/mcp/larapaper"
reactive_resume = "/mcp/reactive-resume"
unifi_network = "/mcp/unifi-network"

[services.agent-browser]
port = 4848
scheme = "http"

[services.browserless]
image = "ghcr.io/browserless/chromium"
port = 9222
shmSize = "1g"
# renovate: datasource=docker depName=ghcr.io/browserless/chromium
version = "v2.64.0"

[services.browserless.environment]
CONCURRENT = 10
HOST = "127.0.0.1"
QUEUED = 20
TIMEOUT = 1800000

[services.connect]
port = 8080
# renovate: datasource=docker depName=1password/connect-api
version = "1.8.4"

[services.dsh]
port = 3080
scheme = "http"

[services.syncthing]
port = 8384
scheme = "http"

[services.traefik]
port = 8443
# renovate: datasource=docker depName=traefik
version = "v3.7.19"
