[bifrost]
baseUrl = "https://bifrost.excloo.com/v1"

[mcp.actual_budget]
url = "https://bifrost.excloo.com/mcp/actual-budget"

[mcp.home_assistant]
url = "https://bifrost.excloo.com/mcp/home-assistant"

[mcp.immich]
url = "https://bifrost.excloo.com/mcp/immich"

[mcp.karakeep]
url = "https://bifrost.excloo.com/mcp/karakeep"

[mcp.kubernetes]
url = "https://bifrost.excloo.com/mcp/kubernetes"

[mcp.larapaper]
url = "https://bifrost.excloo.com/mcp/larapaper"

[mcp.reactive_resume]
url = "https://bifrost.excloo.com/mcp/reactive-resume"

[mcp.unifi_network]
url = "https://bifrost.excloo.com/mcp/unifi-network"

[services.browserless]
port = 9222
# renovate: datasource=docker depName=ghcr.io/browserless/chromium
version = "v2.63.0"

[services.connect]
# renovate: datasource=docker depName=1password/connect-api
version = "1.8.4"

# Commands agents ask about before running unless started with AUTO=1; Linux adds its container and Tailscale daemons.
[agentGuard]
ask = [
  "flux reconcile",
  "flux resume",
  "flux suspend",
  "helm install",
  "helm rollback",
  "helm uninstall",
  "helm upgrade",
  "kubectl annotate",
  "kubectl apply",
  "kubectl create",
  "kubectl delete",
  "kubectl edit",
  "kubectl label",
  "kubectl patch",
  "kubectl rollout restart",
  "kubectl rollout undo",
  "kubectl scale",
  "mise run apply",
  "mise run deploy",
  "scp",
  "ssh",
  "tofu apply",
]
askLinux = ["docker", "podman", "tailscale"]
