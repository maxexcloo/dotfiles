{{- /* chezmoi:modify-template */ -}}
{{- $original := .chezmoi.stdin | fromToml -}}
{{- $config := deepCopy $original -}}
{{- $preferences := `
auto_sync = true
case_sensitive = false
filter_mode_shell_up_key_binding = "directory"
inline_height = 10
search_mode = "fuzzy"
show_tabs = false

[logs]
enabled = false

[sync]
records = true
` | fromToml -}}
{{- $config = mergeOverwrite $config $preferences -}}
{{- if deepEqual $original $config -}}
{{ .chezmoi.stdin -}}
{{- else -}}
{{ $config | toToml -}}
{{- end -}}
