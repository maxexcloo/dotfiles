[providers.automation]
type = "1password"
vault = "Automation"
token = { secret = "OP_SERVICE_ACCOUNT_TOKEN" }

[providers.keychain]
service = "fnox"
type = "keychain"

[secrets]
OP_SERVICE_ACCOUNT_TOKEN = { env = false, provider = "keychain", value = "op-service-account-automation" }
# Bifrost virtual keys for the agents' MCP access; 1Password "Bifrost" (Kubelab) holds the originals.
BIFROST_CLAUDE_KEY = { env = false, provider = "keychain", value = "bifrost-claude" }
BIFROST_CODEX_KEY = { env = false, provider = "keychain", value = "bifrost-codex" }
BIFROST_OPENCODE_KEY = { env = false, provider = "keychain", value = "bifrost-opencode" }
BIFROST_PI_KEY = { env = false, provider = "keychain", value = "bifrost-pi" }
