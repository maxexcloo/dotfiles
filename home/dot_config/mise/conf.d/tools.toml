# Shared by the workstation and, through the shared action, by CI.
[settings]
minimum_release_age = "0"

[tools]
1password-cli = "latest"
actionlint = "latest"
chezmoi = "latest"
gh = "latest"
gitleaks = "latest"
helm = "latest"
hk = "latest"
jq = "latest"
node = "latest"
opentofu = "latest"
oxfmt = "latest"
python = "latest"
ruff = "latest"
shellcheck = "latest"
uv = "latest"
yq = "latest"
# Renovate depends on this release, which lacks provenance (2025-09-18, Yarn maintainer).
"npm:renovate" = { version = "latest", trust_policy_excludes = [
  "@yarnpkg/libzip@3.2.2",
] }
