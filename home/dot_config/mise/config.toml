[env]
PI_SKIP_VERSION_CHECK = "1"
PYTEST_ADDOPTS = "-p no:cacheprovider"
PYTHONPYCACHEPREFIX = "{{xdg_cache_home}}/pycache"
RUFF_CACHE_DIR = "{{xdg_cache_home}}/ruff"

[settings]
cache_prune_age = "1d"
trusted_config_paths = ["~/.local/share/orca/workspaces", "~/Projects"]

[settings.upgrade]
prune_after = "0s"

[tools]
atuin = "latest"
bat = "latest"
# btop and eza publish no macOS binaries, so Homebrew installs them there.
btop = { version = "latest", os = ["linux"] }
claude-code = "latest"
codex = "latest"
dust = "latest"
eza = { version = "latest", os = ["linux"] }
fd = "latest"
fzf = "latest"
"github:stablyai/orca" = { version = "latest", os = ["linux"] }
k9s = "latest"
kubectl = { version = "latest", os = ["linux"] }
"npm:@deepseek-ai/dsh" = "latest"
"npm:agent-browser" = "latest"
opencode = "latest"
pi = "latest"
"pipx:gitup" = "latest"
rclone = "latest"
ripgrep = "latest"
talosctl = "latest"
zoxide = "latest"
