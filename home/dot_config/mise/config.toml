[env]
PI_SKIP_VERSION_CHECK = "1"
PYTEST_ADDOPTS = "-p no:cacheprovider"
PYTHONPYCACHEPREFIX = "{{env.HOME}}/.cache/pycache"
RUFF_CACHE_DIR = "{{env.HOME}}/.cache/ruff"

[settings]
cache_prune_age = "1d"
trusted_config_paths = ["~/Projects"]

[settings.upgrade]
prune_after = "0s"

# Shared tools live in conf.d/tools.toml.
[tools]
claude-code = "latest"
codex = "latest"
fnox = "latest"
k9s = "latest"
opencode = "latest"
pi = "latest"
rclone = "latest"
ripgrep = "latest"
talosctl = "latest"
