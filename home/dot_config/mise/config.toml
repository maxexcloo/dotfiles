[env]
PYTEST_ADDOPTS = "-p no:cacheprovider"
PYTHONPYCACHEPREFIX = "{{env.HOME}}/.cache/pycache"
RUFF_CACHE_DIR = "{{env.HOME}}/.cache/ruff"
TF_PLUGIN_CACHE_DIR = "{{env.HOME}}/.cache/opentofu/plugins"

[settings]
cache_prune_age = "1d"
minimum_release_age = "0"
trusted_config_paths = ["~/Projects"]

[settings.upgrade]
prune_after = "0s"

[tools]
1password-cli = "latest"
actionlint = "latest"
chezmoi = "latest"
claude-code = "latest"
codex = "latest"
fnox = "latest"
gh = "latest"
gitleaks = "latest"
helm = "latest"
hk = "latest"
jq = "latest"
k9s = "latest"
node = "latest"
opencode = "latest"
opentofu = "latest"
oxfmt = "latest"
pi = "latest"
python = "latest"
rclone = "latest"
ripgrep = "latest"
ruff = "latest"
shellcheck = "latest"
talosctl = "latest"
uv = "latest"
yq = "latest"
# Renovate depends on this release, which lacks provenance (2025-09-18, Yarn maintainer).
"npm:renovate" = { version = "latest", trust_policy_excludes = ["@yarnpkg/libzip@3.2.2"] }
