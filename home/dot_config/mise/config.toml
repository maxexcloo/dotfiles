[env]
PI_SKIP_VERSION_CHECK = "1"
PYTEST_ADDOPTS = "-p no:cacheprovider"
PYTHONPYCACHEPREFIX = "{{env.HOME}}/Library/Caches/pycache"
RUFF_CACHE_DIR = "{{env.HOME}}/Library/Caches/ruff"

[settings]
cache_prune_age = "1d"
trusted_config_paths = ["~/Projects"]

[settings.upgrade]
prune_after = "0s"

[tools]
claude-code = "latest"
codex = "latest"
k9s = "latest"
opencode = "latest"
pi = "latest"
rclone = "latest"
ripgrep = "latest"
talosctl = "latest"
