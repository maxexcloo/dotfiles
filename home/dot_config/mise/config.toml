[env]
PI_SKIP_VERSION_CHECK = "1"
PYTEST_ADDOPTS = "-p no:cacheprovider"
PYTHONPYCACHEPREFIX = "{{xdg_cache_home}}/pycache"
RUFF_CACHE_DIR = "{{xdg_cache_home}}/ruff"

[settings]
cache_prune_age = "1d"
trusted_config_paths = ["~/Projects"]

[settings.upgrade]
prune_after = "0s"

[tools]
claude-code = "latest"
codex = "latest"
k9s = "latest"
nono = "latest"
opencode = "latest"
pi = "latest"
rclone = "latest"
ripgrep = "latest"
talosctl = "latest"
