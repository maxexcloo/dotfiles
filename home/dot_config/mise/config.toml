[env]
PI_SKIP_VERSION_CHECK = "1"
PYTEST_ADDOPTS = "-p no:cacheprovider"
PYTHONPYCACHEPREFIX = "{{xdg_cache_home}}/pycache"
RUFF_CACHE_DIR = "{{xdg_cache_home}}/ruff"

[settings]
cache_prune_age = "1d"
trusted_config_paths = ["~/.local/share/orca/workspaces", "~/Projects"]

[settings.upgrade]
prune_after = "0s"

[tools]
claude-code = "latest"
codex = "latest"
"github:stablyai/orca" = { version = "latest", os = [
  "linux",
], asset_pattern = "orca-server-linux-{{ arch() }}.tar.gz", strip_components = 1, bin_path = "bin" }
k9s = "latest"
"npm:@deepseek-ai/dsh" = "latest"
"npm:agent-browser" = "latest"
opencode = "latest"
pi = "latest"
rclone = "latest"
ripgrep = "latest"
talosctl = "latest"
