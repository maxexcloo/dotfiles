[settings]
auto_install = false
minimum_release_age = "0"

[settings.task]
run_auto_install = false

[tools]
1password-cli = "latest"
actionlint = "latest"
chezmoi = "latest"
gh = "latest"
helm = "latest"
hk = "latest"
jq = "latest"
node = "latest"
opentofu = "latest"
oxfmt = "latest"
python = "latest"
ruff = "latest"
shellcheck = "latest"
uv = "latest"
yq = "latest"
# Renovate depends on this release, which lacks provenance (2025-09-18, Yarn maintainer).
"npm:renovate" = { version = "latest", trust_policy_excludes = ["@yarnpkg/libzip@3.2.2"] }
