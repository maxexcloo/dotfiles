# Renovate supports only its tested Node.js major.
["dependencies:check"]
description = "Preview Dependency Updates"
dir = "{{cwd}}"
tools = { node = "24" }
run = '''
set -eu
report=$(mktemp)
trap 'rm -f -- "$report"' EXIT
RENOVATE_GITHUB_COM_TOKEN=$(gh auth token)
export RENOVATE_GITHUB_COM_TOKEN
LOG_LEVEL=warn renovate --platform=local --report-path="$report" --report-type=file
jq -r '
  .repositories[].packageFiles[][] | .packageFile as $file | .deps[]
  | select(.updates | length > 0)
  | "\($file): \(.depName) \(.currentValue // .currentDigest[0:7]) -> \(.updates | map(.newValue // .newDigest[0:7]) | join(", "))"
' "$report"
'''

["dependencies:mise:check"]
description = "Preview Project Tool Updates"
dir = "{{cwd}}"
run = "mise upgrade --bump --dry-run --local --no-prune"

["dependencies:mise:update"]
description = "Apply Reviewed Project Tool Updates"
dir = "{{cwd}}"
run = "mise upgrade --bump --local --no-prune"

["dependencies:update"]
description = "Open Dependency Update Pull Requests"
dir = "{{cwd}}"
tools = { node = "24" }
run = '''
set -eu
repository=$(gh repo view --json nameWithOwner --jq .nameWithOwner)
RENOVATE_TOKEN=$(gh auth token)
export RENOVATE_TOKEN
renovate --onboarding=false --platform=github --require-config=required "$repository"
'''
