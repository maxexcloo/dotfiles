["check:actions"]
description = "Lint GitHub Actions Workflows"
dir = "{{cwd}}"
run = "actionlint {{vars.actionlint_args | default(value='')}}"

["check:mise"]
description = "Check Mise Formatting"
dir = "{{cwd}}"
run = "mise fmt --check"

["check:oxfmt"]
description = "Check File Formatting"
dir = "{{cwd}}"
run = "oxfmt --check --no-error-on-unmatched-pattern ."

["check:python"]
description = "Lint Python & Check Formatting"
dir = "{{cwd}}"
run = """
ruff check {{vars.ruff_args | default(value='')}} {{vars.python_paths | default(value='.')}}
ruff format --check {{vars.python_paths | default(value='.')}}
"""

["check:shell"]
description = "Check Shell Scripts"
dir = "{{cwd}}"
run = "shellcheck {{vars.shell_paths | default(value='scripts/*.sh')}}"

["check:typescript"]
description = "Check TypeScript Types"
dir = "{{cwd}}"
run = "tsc --noEmit"

["check:updates"]
description = "Validate Updatecli Policies"
dir = "{{cwd}}"
env.GITHUB_TOKEN = "validation-placeholder"
run = "updatecli manifest validate --config .updatecli.d --strict --unique-tmp-dir"

["check:whitespace"]
description = "Check Diff Whitespace"
dir = "{{cwd}}"
run = "git diff --check"
