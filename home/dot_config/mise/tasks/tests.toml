["test:python"]
description = "Run Python Unit Tests"
dir = "{{cwd}}"
# Projects with a uv lockfile test inside their locked environment. Modules run
# in parallel and print their buffered output as each finishes.
run = '''
set -eu
runner="python -B -m unittest"
if [ -f uv.lock ]; then
  uv sync --locked --quiet
  runner="uv run --locked --no-sync $runner"
fi
export runner
find tests -maxdepth 1 -name 'test_*.py' -exec basename {} \; | sort |
  xargs -I {} -P "$(getconf _NPROCESSORS_ONLN)" sh -c '
    if output=$($runner discover -s tests -p "$1" 2>&1); then status=0; else status=$?; fi
    printf "== %s\n%s\n" "$1" "$output"
    exit "$status"
  ' sh {}
'''
