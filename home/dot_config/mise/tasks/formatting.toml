[fmt]
description = "Run Applicable Shared Formatters"
depends = ["fmt:mise", "fmt:oxfmt", "fmt:python"]

["fmt:mise"]
description = "Format Mise Configuration"
dir = "{{cwd}}"
run = "mise fmt"

["fmt:oxfmt"]
description = "Format Project Files"
dir = "{{cwd}}"
run = "oxfmt --write --no-error-on-unmatched-pattern . '!**/{.mise.toml,mise.toml,.mise/config.toml,mise/config.toml,.config/mise.toml,.config/mise/config.toml,todo*.md}'"

["fmt:python"]
description = "Sort Python Imports & Format Code"
dir = "{{cwd}}"
run = '''
if [ -z "$(git ls-files -- '*.py')" ]; then
  echo "No Python files found; skipping."
  exit 0
fi
ruff check --fix --select I .
ruff format .
'''
