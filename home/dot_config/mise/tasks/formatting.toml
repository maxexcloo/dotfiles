["fmt:mise"]
description = "Format Mise Configuration"
dir = "{{cwd}}"
run = "mise fmt"

["fmt:oxfmt"]
description = "Format Project Files"
dir = "{{cwd}}"
run = "oxfmt --write --no-error-on-unmatched-pattern . '!**/{.mise.toml,mise.toml,.mise/config.toml,mise/config.toml,.config/mise.toml,.config/mise/config.toml}'"

["fmt:python"]
description = "Sort Python Imports & Format Code"
dir = "{{cwd}}"
run = """
ruff check --fix --select I .
ruff format .
"""
