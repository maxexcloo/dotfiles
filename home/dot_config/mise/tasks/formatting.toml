[fmt]
description = "Run Applicable Shared Formatters"
depends = ["fmt:mise", "fmt:oxfmt", "fmt:python"]

["fmt:mise"]
description = "Format Mise Configuration"
dir = "{{cwd}}"
run = "mise fmt"

["fmt:oxfmt"]
description = "Format Project Files"
dir = "{{cwd}}"
# oxfmt reads only local ignore files, so pass Git's global one too.
run = '''
set -- --no-error-on-unmatched-pattern
for ignore in .gitignore .prettierignore "${XDG_CONFIG_HOME:-$HOME/.config}/git/ignore"; do
  [ ! -f "$ignore" ] || set -- "$@" --ignore-path "$ignore"
done
oxfmt --write "$@" . '!**/{.mise.toml,mise.toml,.mise/config.toml,mise/config.toml,.config/mise.toml,.config/mise/config.toml}'
'''

["fmt:python"]
description = "Sort Python Imports & Format Code"
dir = "{{cwd}}"
run = '''
if [ -z "$(git ls-files -- '*.py')" ]; then
  echo "No Python files found; skipping."
  exit 0
fi
ruff check --fix --select I .
ruff format .
'''
