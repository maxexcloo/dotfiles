["services:browserless"]
description = "Start Browserless"
run = '''
{% if os() == "macos" %}
chezmoi apply "$HOME/.config/services"
docker compose --file "$HOME/.config/services/browserless/compose.yaml" up --detach
{% else %}
chezmoi apply "$HOME/.config/containers"
systemctl --user daemon-reload
systemctl --user start browserless.service
{% endif %}
'''

["services:connect"]
description = "Start 1Password Connect"
run = '''
chezmoi apply "$HOME/.config/services"
{% if os() == "macos" %}
docker compose --file "$HOME/.config/services/onepassword-connect/compose.yaml" up --detach
{% else %}
service_directory="$HOME/.config/services/onepassword-connect"
sudo install -D -m 0644 -t /etc/containers/systemd "$service_directory/onepassword-connect-api.container" "$service_directory/onepassword-connect-sync.container" "$service_directory/onepassword-connect.pod"
sudo systemctl daemon-reload
sudo systemctl start onepassword-connect-pod.service
{% endif %}
'''

["services:playwright"]
description = "Start Project Playwright Browsers"
run = '''
set -eu
version=$(node -p "require('playwright/package.json').version")
{% if os() == "macos" %}
runtime=docker
{% else %}
runtime=podman
{% endif %}
echo "export PW_TEST_CONNECT_WS_ENDPOINT=ws://127.0.0.1:$usage_port/"
echo "export PW_TEST_CONNECT_EXPOSE_NETWORK='<loopback>'"
exec "$runtime" run --rm --init --user pwuser --workdir /home/pwuser --shm-size 1g --publish "127.0.0.1:$usage_port:3000" "mcr.microsoft.com/playwright:v$version-noble" npx --yes "playwright@$version" run-server --port 3000 --host 0.0.0.0
'''
usage = 'flag "--port <port>" default="9223" help="Loopback port for the Playwright server"'
