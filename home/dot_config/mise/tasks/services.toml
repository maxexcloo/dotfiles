["dsh:serve"]
description = "Serve The Persistent dsh Web UI"
run = 'fnox exec --redact --config "${XDG_CONFIG_HOME:-$HOME/.config}/dsh/fnox.toml" --only BIFROST_DSH_KEY -- python3 "${XDG_CONFIG_HOME:-$HOME/.config}/dsh/serve.py" "$@"'

["services:browserless:start"]
description = "Start Browserless On Linux"
run = '''
fnox exec --redact --config "${XDG_CONFIG_HOME:-$HOME/.config}/services/browserless/fnox.toml" --only BROWSERLESS_TOKEN -- sh -eu -c '
  printf %s "$BROWSERLESS_TOKEN" | podman secret create --replace browserless-token - >/dev/null
  podman compose --file "${XDG_CONFIG_HOME:-$HOME/.config}/services/browserless/compose.yaml" up --detach --force-recreate
'
'''
