{{- /* chezmoi:modify-template */ -}}
{{- $original := .chezmoi.stdin | fromToml -}}
{{- $config := deepCopy $original -}}
{{- $preferences := includeTemplate "codex.toml" . | fromToml -}}
{{- $config = mergeOverwrite $config $preferences -}}
{{- $_ := unset $config "approvals_reviewer" -}}
{{- $config = setValueAtPath (list "projects" .chezmoi.homeDir "trust_level") "trusted" $config -}}
{{- $caches := list "Library/Caches" -}}
{{- if ne .chezmoi.os "darwin" -}}{{- $caches = list ".cache" -}}{{- end -}}
{{- $roots := list -}}
{{- range append $caches ".local/state" -}}{{- $roots = append $roots (joinPath $.chezmoi.homeDir .) -}}{{- end -}}
{{- $config = setValueAtPath (list "sandbox_workspace_write" "writable_roots") $roots $config -}}
{{- $config = setValueAtPath (list "sandbox_workspace_write" "network_access") true $config -}}
{{- $key := includeTemplate "bifrost-key" "codex" -}}
{{- range $name, $server := .mcp -}}
{{- $config = setValueAtPath (list "mcp_servers" $name "url") $server.url $config -}}
{{- $server := index $config "mcp_servers" $name -}}
{{- $_ := unset $server "bearer_token_env_var" -}}
{{- $_ := set $server "http_headers" (dict "Authorization" (printf "Bearer %s" $key)) -}}
{{- end -}}
{{- if deepEqual $original $config -}}
{{ .chezmoi.stdin -}}
{{- else -}}
{{ $config | toToml -}}
{{- end -}}
