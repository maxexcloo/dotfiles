{{- /* chezmoi:modify-template */ -}}
{{- $text := regexReplaceAll "(?s)# BEGIN nono-pack:[^\n]*\n.*?# END nono-pack:[^\n]*\n" .chezmoi.stdin "" -}}
{{- $original := $text | fromToml -}}
{{- $config := deepCopy $original -}}
{{- $preferences := includeTemplate "codex.toml" . | fromToml -}}
{{- $config = mergeOverwrite $config $preferences -}}
{{- $config = setValueAtPath (list "projects" .chezmoi.homeDir "trust_level") "trusted" $config -}}
{{- /* nono's pack inserts its marked block above existing top-level keys, which breaks the file's structure; place its settings here instead. */ -}}
{{- $nonoBlock := joinPath .chezmoi.homeDir ".config/nono/packages/nolabs-ai/codex/wiring/codex-block.toml" -}}
{{- if stat $nonoBlock -}}
{{- $nono := include $nonoBlock | replace "$HOME" .chezmoi.homeDir | fromToml -}}
{{- range $path, $project := get $config "projects" -}}
{{- $_ := unset $project "developer_instructions" -}}
{{- end -}}
{{- $_ := unset (get $config "plugins" | default dict) "nono@nolabs-ai" -}}
{{- $config = mergeOverwrite $config $nono -}}
{{- end -}}
{{- range $name, $server := .mcp -}}
{{- $config = setValueAtPath (list "mcp_servers" $name "url") $server.url $config -}}
{{- $server := index $config "mcp_servers" $name -}}
{{- $_ := unset $server "http_headers" -}}
{{- $_ := set $server "bearer_token_env_var" "BIFROST_CODEX_KEY" -}}
{{- end -}}
{{- if and (deepEqual $original $config) (eq $text .chezmoi.stdin) -}}
{{ .chezmoi.stdin -}}
{{- else -}}
{{ $config | toToml -}}
{{- end -}}
