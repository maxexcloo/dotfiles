name: Check
on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  cancel-in-progress: true
  group: check-${{ github.ref }}
jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set Up Shared Tools & Tasks
        uses: ./.github/actions/mise
        with:
          tools: actionlint chezmoi hk node node@24 npm:renovate oxfmt
      - name: Install Fish
        run: |
          sudo apt-get update
          sudo apt-get install --yes fish
      - name: Run Checks
        run: mise run check
