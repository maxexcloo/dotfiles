description: Load shared tools and tasks without applying workstation preferences.
name: Set Up Shared Mise

inputs:
  project-tools:
    default: "false"
    description: Also install every tool declared in the repository's own Mise configuration.
  tools:
    default: ""
    description: Space-separated tools to install from the shared and repository configurations.

runs:
  using: composite
  steps:
    - name: Configure Shared Mise
      shell: bash
      env:
        SHARED_MISE_DIRECTORY: ${{ github.action_path }}/../../../home/dot_config/mise
      run: |
        {
          echo "MISE_AUTO_INSTALL=false"
          echo "MISE_CONFIG_DIR=$SHARED_MISE_DIRECTORY"
          # Load the shared tools without the workstation configuration.
          echo "MISE_GLOBAL_CONFIG_FILE=$SHARED_MISE_DIRECTORY/conf.d/tools.toml"
          # Source builds of fresh Python releases lack stdlib modules and stall CI setup.
          echo "MISE_PYTHON_COMPILE=false"
          echo "MISE_TASK_RUN_AUTO_INSTALL=false"
        } >> "$GITHUB_ENV"
    - name: Set Up Tools
      uses: jdx/mise-action@v5
      with:
        # Save at job end so project tools installed below are cached too.
        cache_save_post: true
        install_args: ${{ inputs.tools }}
    - if: inputs.project-tools == 'true'
      name: Install Project Tools
      shell: bash
      run: |
        tools=$(mise ls --local --json | jq -r 'keys | join(" ")')
        if [ -n "$tools" ]; then
          # shellcheck disable=SC2086
          mise install $tools
        fi
