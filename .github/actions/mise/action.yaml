name: Set Up Shared Mise
description: Load shared tools and tasks without applying workstation preferences.
inputs:
  tools:
    default: ""
    description: Space-separated tools to install from the shared and repository configurations.
runs:
  using: composite
  steps:
    - name: Configure Shared Mise
      env:
        SHARED_MISE_DIRECTORY: ${{ github.action_path }}/../../../home/dot_config/mise
      run: |
        echo "MISE_CONFIG_DIR=$SHARED_MISE_DIRECTORY" >> "$GITHUB_ENV"
        echo "MISE_GLOBAL_CONFIG_FILE=$SHARED_MISE_DIRECTORY/ci.toml" >> "$GITHUB_ENV"
      shell: bash
    - name: Set Up Tools
      uses: jdx/mise-action@v5
      with:
        install_args: ${{ inputs.tools }}
        version: 2026.10.9
