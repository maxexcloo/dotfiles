repos:
  - repo: builtin
    hooks:
      - id: check-json
        exclude: (^|/)modify_
      - id: check-merge-conflict
      - id: check-toml
        exclude: (^|/)modify_
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
        args: [--check]
      - id: trailing-whitespace
        args: [--check]
  - repo: local
    hooks:
      - id: fish-syntax
        name: Check Fish Syntax
        entry: fish --no-execute
        language: system
        files: \.fish$
