[tools]
# chezmoi = "latest"

[tasks.apply]
run = 'chezmoi --source "{{config_root}}" apply'

[tasks.check]
depends = ["check:actions", "check:updates", "hooks:check"]

[tasks.fmt]
depends = ["fmt:oxfmt"]

[tasks.setup]
run = 'chezmoi --source "{{config_root}}" init'

[tasks.status]
run = 'chezmoi --source "{{config_root}}" status'

[tasks.verify]
run = 'chezmoi --source "{{config_root}}" verify'
