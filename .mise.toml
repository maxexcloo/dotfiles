[tools]
chezmoi = "latest"

[tasks.apply]
run = 'chezmoi --source "{{config_root}}" apply'

[tasks.check]
depends = [
  "check:actions",
  "check:python",
  "check:updates",
  "hooks:check",
  "test:python",
]

[tasks.fmt]
depends = ["fmt:python"]

[tasks.setup]
run = 'chezmoi --source "{{config_root}}" init'

[tasks.status]
run = 'chezmoi --source "{{config_root}}" status'

[tasks.verify]
run = 'chezmoi --source "{{config_root}}" verify'
