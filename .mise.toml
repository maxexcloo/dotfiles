[tasks.check]
depends = [
  "check:actions",
  "check:agent-launcher",
  "check:mise",
  "check:templates",
  "check:updates",
  "hooks:check",
  "test",
]

[tasks."check:agent-launcher"]
run = [
  "ruff check home/dot_local/bin/executable_nono-agent",
  "ruff format --check home/dot_local/bin/executable_nono-agent",
]

[tasks."check:mise"]
run = '''
set -eu
status=0
for config in .mise.toml home/dot_config/mise/*.toml home/dot_config/mise/*/*.toml; do
  formatted=$(mise fmt --stdin < "$config")
  printf '%s\n' "$formatted" | diff -u "$config" - || status=1
done
exit "$status"
'''

# Hk's oxfmt step skips templated code, so check its rendered output.
[tasks."check:templates"]
# Templates read keys with fnox; tests/bin holds a stand-in.
env = { PATH = "{{config_root}}/tests/bin:{{env.PATH}}" }
run = '''
set -eu
status=0
for template in $(git ls-files '*.js.tmpl' '*.ts.tmpl'); do
  rendered=$(chezmoi --source . --config /dev/null --config-format toml execute-template --file "$template")
  formatted=$(printf '%s\n' "$rendered" | oxfmt --stdin-filepath "${template%.tmpl}")
  if [ "$rendered" != "$formatted" ]; then
    echo "$template renders unformatted code"
    status=1
  fi
done
exit "$status"
'''

[tasks."fmt:mise"]
run = '''
set -eu
for config in .mise.toml home/dot_config/mise/*.toml home/dot_config/mise/*/*.toml; do
  formatted=$(mise fmt --stdin < "$config")
  printf '%s\n' "$formatted" > "$config"
done
'''

[tasks.setup]
run = 'chezmoi --source "{{config_root}}" init'

[tasks.test]
run = "node --test"
